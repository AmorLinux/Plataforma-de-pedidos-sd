services:
  inventario:
    build: ./inventario
    environment:
      PORT: "3001"
      RETARDO_MS: "1000"
    ports:
      - "3001:3001"

  pedidos:
    build: ./pedidos
    environment:
      PORT: "3000"
      INVENTARIO_URL: "http://inventario:3001"
      TIMEOUT_MS: "2000"
    ports:
      - "3000:3000"
    depends_on:
      - inventario
